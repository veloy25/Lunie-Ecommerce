name: CI

on:
  push:
    branches: [dev, homolog, main]
  pull_request:
    branches: [dev, homolog, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/client/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: Client/client
      - run: npm test
        working-directory: Client/client
      - run: npm run build
        working-directory: Client/client

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./lunie-ci.db
      CATALOG_PATH: catalog/products.json
      SHIPPING_SIMULATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: Server
      - run: alembic upgrade head
        working-directory: Server
      - run: python -m pytest -q tests
        working-directory: Server
